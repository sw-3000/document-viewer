name: Release Windows

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Package Windows (x64)
    runs-on: windows-latest
    shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies & sync offline PDF.js assets
        run: |
          npm ci
          if (-not (Test-Path "public/pdfjs/cmaps") -or -not (Test-Path "public/pdfjs/standard_fonts")) {
            throw "Offline pdfjs-dist assets failed to sync into public/pdfjs/"
          }

      - name: Verify manifest SemVer consistency
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            node scripts/bump-version.mjs --check --expect-tag "${{ github.ref_name }}"
          } else {
            npm run version:check
          }

      - name: Run frontend typecheck and unit tests
        run: |
          npx tsc --noEmit
          npm test

      - name: Run Rust check and unit tests
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows NSIS & MSI installers
        env:
          # Optional signing secrets for future release signing; unsigned builds stay clean when unset.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Collect installers and generate SHA256SUMS.txt
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $artifacts = @()
          $artifacts += Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue
          $artifacts += Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -ErrorAction SilentlyContinue
          if ($artifacts.Count -eq 0) {
            throw "No Windows installer bundles were found."
          }
          foreach ($file in $artifacts) {
            Copy-Item -Path $file.FullName -Destination "release-assets/$($file.Name)" -Force
          }
          $hashes = Get-ChildItem -Path "release-assets" -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $hashes | Out-File -FilePath "release-assets/SHA256SUMS.txt" -Encoding ascii
          Get-Content "release-assets/SHA256SUMS.txt"

      - name: Upload workflow_dispatch dry-run artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: document-viewer-windows-x64
          path: release-assets/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
