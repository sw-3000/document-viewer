[package]
name = "document-viewer"
version = "0.1.0"
description = "Lightweight, distraction-free PDF reader for Windows"
authors = ["Document Viewer Contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "document_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_Foundation"] }
